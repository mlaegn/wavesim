# Real-world spots the fetch tool can turn into bed files.
#
# The output grid is rotated so that +x points along `bearing` (compass degrees,
# clockwise from north: the direction the waves travel, towards the beach) and +y is
# 90 degrees counter-clockwise from +x. The anchor (lat, lon) sits `offshore_m` from
# the offshore edge and `onshore_m` from the landward edge, and the domain is
# `width_m` wide, centred on the anchor.

# A spot's bed reaches far enough offshore for the biggest swell you want to run there: the
# wave-maker goes where a sinusoid is still the right wave, which for a 2.5 m, 14 s swell is
# about 23 m deep and for a 4 m, 16 s swell about 34 m (see MAX_SECOND_HARMONIC in
# crates/wavesim/src/lib.rs). A run crops off whatever is further offshore than its own
# wave-maker and sponge need, so a long bed costs a small swell nothing. Onshore, keep a little
# more land than the run-up reaches; `clip_above` flattens the rest. The sides are walls, which
# mirror the bed, so make the bed twice as wide as what you want to look at: on this bed the
# middle half was right to within 4% (12% at worst) against a domain nearly twice as wide.

[pipeline]
description = "Banzai Pipeline, Oahu North Shore, Hawaii"
source = "NOAA NCEI CUDEM 1/9 arc-second topobathy, Hawaii"
url = "https://noaa-nos-coastal-lidar-pds.s3.amazonaws.com/dem/NCEI_ninth_Topobathy_Hawaii_9428/tiles/ncei19_n21x75_w158x25_2021v1.tif"
datum = "local mean sea level"
attribution = "NOAA National Centers for Environmental Information"
lat = 21.665
lon = -158.051
utm_crs = "EPSG:32604"
bearing = 130.0      # shore-normal, estimated from the seabed gradient (median 131 deg)
offshore_m = 2400.0  # the shelf is 10-14 m deep for a kilometre; 25-45 m beyond 1.5 km
onshore_m = 50.0
width_m = 1200.0     # the sides are walls: the middle 600 m is what to look at
cell_m = 3.0
clip_above = 6.0     # land higher than this is flattened; waves never reach it

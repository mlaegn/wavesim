[workspace]
resolver = "3"
members = ["crates/wavecore", "crates/waveio", "crates/wavesim"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"

# Tests are numerical runs; unoptimised builds make the wave tests take minutes.
[profile.test]
opt-level = 3

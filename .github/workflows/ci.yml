# Checks on GitHub's machines, so that the laptop only ever runs the quick ones.
#
# Every push to main and every pull request: format, lints and the fast tests of the Rust
# workspace, the Python tools' tests and the viewer's. The slow physics tests (whole
# simulations, `#[ignore]`d locally) run once a week and on demand: Actions > CI > Run workflow,
# with "slow" ticked, or `gh workflow run ci.yml -f slow=true --ref <branch>`.
#
# The Rust jobs run on macOS on Apple silicon, the laptop's platform, so a result checked here
# is the result a run there gives.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: "Also run the slow physics tests (an hour or more)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC: the slow tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  rust:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >-
          uv run --python 3.12 --with pytest --with rasterio --with numpy --with scipy
          --with pyproj --with contourpy pytest -p no:cacheprovider tools

  viewer:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  slow:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.slow)
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      # One test at a time: some of them time themselves.
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --workspace -- --include-ignored

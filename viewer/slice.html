<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wavesim side view</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/sidewave.css" />
  </head>
  <body class="sidewave">
    <canvas id="side"></canvas>

    <header class="bar top">
      <strong class="brand">wavesim</strong>
      <span>Side view of one breaking wave</span>
      <select id="slices" aria-label="Seabed"></select>
      <a class="button" href="/">3D runs</a>
      <span id="now"></span>
    </header>

    <aside id="sideinfo">
      <dl id="facts"></dl>
      <p class="legend">
        Surface colour: how fast the water moves against the wave.
        <span class="ramp"></span>
        <span class="ramp-labels"><span>still</span><span>0.6</span><span>0.9</span><span>faster than the wave</span></span>
      </p>
    </aside>

    <p id="message">Loading…</p>

    <footer class="bar bottom" id="controls" hidden>
      <button id="play" type="button" aria-label="Play or pause">Pause</button>
      <input id="scrub" type="range" min="0" max="1" step="any" value="0" aria-label="Time" />
      <span id="clock">0.00 / 0 s</span>
      <label>Speed
        <select id="speed">
          <option value="1" selected>1×</option>
          <option value="0.25">¼×</option>
          <option value="0.1">1/10×</option>
          <option value="0.03">1/30×</option>
        </select>
      </label>
      <label>View
        <select id="frame">
          <option value="break" selected>the break, true proportions</option>
          <option value="whole">whole tank, height stretched</option>
        </select>
      </label>
      <button id="to-break" type="button">Watch the break slowly</button>
    </footer>

    <script type="module" src="/src/sidewave.ts"></script>
  </body>
</html>
